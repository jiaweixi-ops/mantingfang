[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "songhua-ai-governor"
version = "0.1.0"
description = "Safe, DeepSeek-only automation foundation for 满庭芳：宋上繁华"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
feishu-encryption = ["cryptography>=41"]

[project.scripts]
songhua-governor = "ai_governor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
