name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  doorstop-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build no-op Doorstop bootstrap
        run: dotnet build runtime_probe/DoorstopBootstrap.csproj --configuration Release
      - name: Publish Doorstop bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoorstopTelemetryBootstrap
          path: runtime_probe/bin/Release/net40/DoorstopTelemetryBootstrap.dll
          if-no-files-found: error

  bridge-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compile Runtime Bridge with safe stubs
        run: dotnet build runtime_bridge/compile-check/BridgeCompileCheck.csproj --configuration Release

  mono-assembly-enumerator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build minimal read-only Mono assembly enumerator
        run: dotnet publish runtime_probe/MonoAssemblyEnumerator.csproj --configuration Release --output runtime_probe/publish/assembly-enumerator
      - name: Publish Mono assembly enumerator artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonoAssemblyEnumerator
          path: runtime_probe/publish/assembly-enumerator/
          if-no-files-found: error

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q src
      - name: Check diff whitespace
        run: git diff --check

  windows-core:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Install package
        run: python -m pip install -e .
      - name: Import Windows-capable modules
        run: python -c "import ai_governor.cli, ai_governor.capture, ai_governor.input, ai_governor.window"
      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q src
      - name: Check diff whitespace
        run: git diff --check
